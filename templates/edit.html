{% extends "base.html" %}

{% block title %}
Edit Student
{% endblock %}

{% block content %}

<div class="container">

    <div class="student-form-card mx-auto" style="max-width:700px;">

        <h2 class="text-center mb-4">
            ✏️ Edit Student
        </h2>

        <form method="POST">

            <input
                type="text"
                name="name"
                value="{{ student.name }}"
                placeholder="Student Name"
                required
            >

            <input
                type="number"
                name="age"
                value="{{ student.age }}"
                placeholder="Age"
                required
            >

            <input
                type="text"
                name="major"
                value="{{ student.major }}"
                placeholder="Major"
                required
            >

            <input
                type="email"
                name="email"
                value="{{ student.email }}"
                placeholder="Email"
                required
            >

            <button type="submit" class="mt-3">
                💾 Save Changes
            </button>

            <a href="{{ url_for('home') }}"
               class="btn btn-secondary w-100 mt-3">
                ⬅ Back to Dashboard
            </a>

        </form>

    </div>

</div>

{% endblock %}
